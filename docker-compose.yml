version: '3.8'

services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-mysql_password}
      MYSQL_DATABASE: ${DB_NAME:-ecommerce_dw}
      MYSQL_USER: ${DB_USER:-mysql_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mysql_password}
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  etl:
    build: .
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-ecommerce_dw}
      - DB_USER=${DB_USER:-mysql_user}
      - DB_PASSWORD=${DB_PASSWORD:-mysql_password}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

volumes:
  mysqldata:
